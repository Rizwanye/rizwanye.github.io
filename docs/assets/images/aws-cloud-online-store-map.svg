<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual AWS Cloud map for an online store</title>
  <desc id="desc">A customer request flows through content delivery to application compute, a database, and object storage. IAM controls access and CloudWatch observes the system.</desc>
  <rect width="1200" height="680" rx="34" fill="#f6f1e8"/>
  <text x="70" y="72" font-family="Manrope, Arial, sans-serif" font-size="34" font-weight="800" fill="#18202b">An online store inside AWS Cloud</text>
  <text x="70" y="110" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#586271">Follow one customer request through the responsibilities of the system.</text>

  <rect x="62" y="176" width="180" height="112" rx="22" fill="#ffffff" stroke="#c8c2b8" stroke-width="2"/>
  <text x="152" y="222" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#18202b">Customer</text>
  <text x="152" y="253" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#586271">Browser request</text>

  <path d="M242 232 H318" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
  <path d="M306 220 L321 232 L306 244" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="322" y="176" width="220" height="112" rx="22" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="432" y="218" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#18202b">Content delivery</text>
  <text x="432" y="247" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#586271">CloudFront</text>
  <text x="432" y="270" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#586271">Moves content closer</text>

  <path d="M542 232 H618" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
  <path d="M606 220 L621 232 L606 244" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="622" y="176" width="220" height="112" rx="22" fill="#fff2e8" stroke="#c06b2b" stroke-width="2"/>
  <text x="732" y="218" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#18202b">Application code</text>
  <text x="732" y="247" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#586271">EC2 or Lambda</text>
  <text x="732" y="270" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#586271">Runs store logic</text>

  <path d="M842 214 H930 V350" stroke="#0f766e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M918 338 L930 353 L942 338" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M732 288 V350" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
  <path d="M720 338 L732 353 L744 338" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="622" y="356" width="220" height="112" rx="22" fill="#ffffff" stroke="#c8c2b8" stroke-width="2"/>
  <text x="732" y="398" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#18202b">Order records</text>
  <text x="732" y="427" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#586271">RDS or DynamoDB</text>
  <text x="732" y="450" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#586271">Keeps structured data</text>

  <rect x="882" y="356" width="220" height="112" rx="22" fill="#ffffff" stroke="#c8c2b8" stroke-width="2"/>
  <text x="992" y="398" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#18202b">Product media</text>
  <text x="992" y="427" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#586271">Amazon S3</text>
  <text x="992" y="450" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" fill="#586271">Keeps files and objects</text>

  <rect x="62" y="526" width="480" height="94" rx="22" fill="#1f2937"/>
  <text x="92" y="565" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">IAM controls who and what may act</text>
  <text x="92" y="594" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#dbe3ee">Permissions surround every connection, not only the login screen.</text>

  <rect x="582" y="526" width="520" height="94" rx="22" fill="#0f766e"/>
  <text x="612" y="565" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">CloudWatch observes health and activity</text>
  <text x="612" y="594" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#e6f4f1">Metrics, logs, and alarms provide evidence about system behaviour.</text>
</svg>
